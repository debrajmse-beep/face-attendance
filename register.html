<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face Recognition</title>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/human/dist/human.js"></script>

  <style>
    body {
      text-align: center;
      font-family: Arial;
      margin: 20px;
    }

    video {
      width: 90%;
      max-width: 500px;
      border-radius: 12px;
      background: black;
      margin-top: 15px;
    }

    #status {
      font-size: 18px;
      font-weight: bold;
    }

    #result {
      font-size: 24px;
      font-weight: bold;
      margin-top: 20px;
    }

    #score {
      font-size: 18px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h2>👤 Face Recognition</h2>

<p id="status">Starting...</p>

<video id="video" autoplay muted playsinline></video>

<p id="result">Looking for face...</p>

<p id="score"></p>

<script>

const video = document.getElementById("video");
const status = document.getElementById("status");
const resultText = document.getElementById("result");
const scoreText = document.getElementById("score");

let human = null;
let busy = false;


// ==============================
// HUMAN CONFIG
// ==============================

const config = {

  backend: "webgl",

  modelBasePath:
    "https://cdn.jsdelivr.net/npm/@vladmandic/human/models/",

  face: {

    enabled: true,

    detector: {
      enabled: true,
      rotation: true,
      maxDetected: 1
    },

    mesh: {
      enabled: true
    },

    description: {
      enabled: true
    },

    iris: {
      enabled: false
    }

  },

  body: {
    enabled: false
  },

  hand: {
    enabled: false
  },

  object: {
    enabled: false
  }

};


// ==============================
// START
// ==============================

async function start() {

  try {

    status.innerText = "📷 Starting camera...";

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: 640,
          height: 480
        },
        audio: false
      });

    video.srcObject = stream;

    await video.play();

    status.innerText = "⚙️ Starting Face AI...";

    human = new Human.Human(config);

    status.innerText = "✅ Face AI Ready";

    resultText.innerText =
      "👤 Looking for face...";

    recognizeFace();

  } catch (error) {

    console.error(error);

    status.innerText =
      "❌ Error: " + error.message;

  }

}


// ==============================
// RECOGNITION
// ==============================

async function recognizeFace() {

  if (!human || busy) {
    setTimeout(recognizeFace, 500);
    return;
  }

  busy = true;

  try {

    const detected =
      await human.detect(video);

    // No face
    if (
      !detected.face ||
      detected.face.length === 0 ||
      !detected.face[0].embedding
    ) {

      resultText.innerText =
        "👤 No Face Detected";

      scoreText.innerText = "";

      busy = false;

      setTimeout(recognizeFace, 500);

      return;
    }


    // Current face
    const currentEmbedding =
      detected.face[0].embedding;


    // Load registered faces
    const database =
      JSON.parse(
        localStorage.getItem("faceDatabase") || "[]"
      );


    // No registered face
    if (database.length === 0) {

      resultText.innerText =
        "❌ No Registered Employee";

      scoreText.innerText =
        "আগে register.html থেকে face register করুন";

      busy = false;

      setTimeout(recognizeFace, 1000);

      return;
    }


    // Create embedding list
    const embeddings =
      database.map(person => person.embedding);


    // Find best match
    const match =
      human.match.find(
        currentEmbedding,
        embeddings
      );


    // No valid match
    if (
      !match ||
      match.index < 0
    ) {

      resultText.innerText =
        "❌ Unknown Face";

      scoreText.innerText = "";

      busy = false;

      setTimeout(recognizeFace, 700);

      return;
    }


    const person =
      database[match.index];

    const similarity =
      match.similarity;


    const percentage =
      Math.round(similarity * 100);


    // Recognition threshold
    // 50% or more = match
    if (similarity >= 0.50) {

      resultText.innerText =
        "✅ " + person.employeeName;

      scoreText.innerText =
        "Employee ID: " +
        person.employeeId +
        " | Match: " +
        percentage +
        "%";

    } else {

      resultText.innerText =
        "❌ Unknown Face";

      scoreText.innerText =
        "Match: " + percentage + "%";

    }

  } catch (error) {

    console.error(error);

    resultText.innerText =
      "⚠️ Recognition Error";

    scoreText.innerText =
      error.message;

  }


  busy = false;

  setTimeout(recognizeFace, 500);

}


// START
start();

</script>

</body>
</html>
