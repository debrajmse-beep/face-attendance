<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Face Registration</title>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/human/dist/human.js"></script>

  <style>
    body {
      text-align: center;
      font-family: Arial;
      margin: 20px;
    }

    input {
      width: 90%;
      max-width: 400px;
      padding: 12px;
      margin: 7px;
      font-size: 17px;
      box-sizing: border-box;
    }

    button {
      padding: 12px 25px;
      margin: 8px;
      font-size: 17px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
    }

    video {
      width: 90%;
      max-width: 500px;
      border-radius: 12px;
      background: black;
      margin-top: 15px;
    }

    #status {
      font-size: 18px;
      font-weight: bold;
    }

    #result {
      font-size: 20px;
      font-weight: bold;
      margin-top: 15px;
    }

    #employeeNameDisplay {
      margin-top: 12px;
      min-height: 32px;
      font-size: 24px;
      font-weight: bold;
      color: #16a34a;
    }

    #employeeList {
      margin-top: 25px;
      text-align: left;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .employee {
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .deleteBtn {
      float: right;
      padding: 5px 10px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<h2>👤 Employee Face Registration</h2>

<input
  type="text"
  id="employeeId"
  placeholder="Employee ID e.g. MSE002"
>

<input
  type="text"
  id="employeeName"
  placeholder="Employee Name"
>

<br>

<button onclick="registerFace()">
  📸 Register Face
</button>

<button onclick="clearFields()">
  Clear
</button>

<p id="status">Starting camera...</p>

<video
  id="video"
  autoplay
  muted
  playsinline
></video>

<p id="result">
  Enter Employee ID and Name
</p>

<div id="employeeNameDisplay"></div>

<div id="employeeList"></div>


<script>

const video =
  document.getElementById("video");

const statusText =
  document.getElementById("status");

const resultText =
  document.getElementById("result");

const employeeNameDisplay =
  document.getElementById("employeeNameDisplay");

const employeeIdInput =
  document.getElementById("employeeId");

const employeeNameInput =
  document.getElementById("employeeName");

const employeeList =
  document.getElementById("employeeList");

let human = null;
let busy = false;


// ==========================================
// HUMAN CONFIG
// ==========================================

const config = {

  backend: "webgl",

  modelBasePath:
    "https://cdn.jsdelivr.net/npm/@vladmandic/human/models/",

  face: {

    enabled: true,

    detector: {
      enabled: true,
      rotation: true,
      maxDetected: 1
    },

    mesh: {
      enabled: true
    },

    description: {
      enabled: true
    },

    iris: {
      enabled: false
    }

  },

  body: {
    enabled: false
  },

  hand: {
    enabled: false
  },

  object: {
    enabled: false
  }

};


// ==========================================
// START CAMERA
// ==========================================

async function start() {

  try {

    statusText.innerText =
      "📷 Starting camera...";

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user",
          width: 640,
          height: 480
        },

        audio: false

      });

    video.srcObject = stream;

    await video.play();

    statusText.innerText =
      "⚙️ Starting Face AI...";

    human =
      new Human.Human(config);

    statusText.innerText =
      "✅ Camera Ready";

    resultText.innerText =
      "Enter Employee ID and Name";

    showEmployees();

  } catch (error) {

    console.error(error);

    statusText.innerText =
      "❌ Camera Error";

    if (error.name === "NotAllowedError" || error.name === "PermissionDeniedError") {
      resultText.innerText = "Camera permission denied. Please allow Camera permission and reopen the page.";
    } else if (error.name === "NotFoundError") {
      resultText.innerText = "No camera found on this device.";
    } else {
      resultText.innerText = error.message || "Unable to start camera.";
    }

  }

}


// ==========================================
// REGISTER FACE
// ==========================================

async function registerFace() {

  if (busy) return;

  const employeeId =
    employeeIdInput.value.trim();

  const employeeName =
    employeeNameInput.value.trim();


  // ========================================
  // VALIDATION
  // ========================================

  if (!employeeId) {

    alert("Please enter Employee ID");

    return;
  }


  if (!employeeName) {

    alert("Please enter Employee Name");

    return;
  }


  if (!human) {

    alert("Face AI is not ready yet");

    return;
  }


  busy = true;
  employeeNameDisplay.innerText = "👤 " + employeeName;

  try {

    resultText.innerText =
      "🔍 Detecting face...";


    const detected =
      await human.detect(video);


    // ======================================
    // FACE CHECK
    // ======================================

    if (
      !detected.face ||
      detected.face.length === 0
    ) {

      resultText.innerText =
        "❌ No face detected";
      employeeNameDisplay.innerText = "👤 " + employeeName;

      busy = false;

      return;
    }


    if (
      !detected.face[0].embedding
    ) {

      resultText.innerText =
        "❌ Face embedding unavailable";
      employeeNameDisplay.innerText = "👤 " + employeeName;

      busy = false;

      return;
    }


    const embedding =
      detected.face[0].embedding;


    // ======================================
    // LOAD DATABASE
    // ======================================

    let database =
      JSON.parse(
        localStorage.getItem(
          "faceDatabase"
        ) || "[]"
      );


    // ======================================
    // CHECK DUPLICATE ID
    // ======================================

    const existingIndex =
      database.findIndex(
        person =>
          String(person.employeeId)
            .toUpperCase() ===
          employeeId.toUpperCase()
      );


    const employeeData = {

      employeeId:
        employeeId,

      employeeName:
        employeeName,

      embedding:
        embedding

    };


    // ======================================
    // UPDATE EXISTING
    // ======================================

    if (existingIndex !== -1) {

      const confirmUpdate =
        confirm(
          "This Employee ID already exists.\n\n" +
          "Do you want to replace the existing face?"
        );


      if (!confirmUpdate) {

        busy = false;

        return;
      }


      database[existingIndex] =
        employeeData;


      resultText.innerText =
        "✅ Face updated successfully";
      employeeNameDisplay.innerText = "👤 " + employeeName;

    }

    // ======================================
    // NEW EMPLOYEE
    // ======================================

    else {

      database.push(
        employeeData
      );


      resultText.innerText =
        "✅ Employee registered successfully";
      employeeNameDisplay.innerText = "👤 " + employeeName;

    }


    // ======================================
    // SAVE DATABASE
    // ======================================

    localStorage.setItem(
      "faceDatabase",
      JSON.stringify(database)
    );


    showEmployees();


    // ======================================
    // CLEAR INPUT
    // ======================================

    employeeIdInput.value = "";
    employeeNameInput.value = "";


  } catch (error) {

    console.error(error);

    resultText.innerText =
      "❌ Registration Error";

    alert(error.message);

  }


  busy = false;

}


// ==========================================
// SHOW REGISTERED EMPLOYEES
// ==========================================

function showEmployees() {

  const database =
    JSON.parse(
      localStorage.getItem(
        "faceDatabase"
      ) || "[]"
    );


  if (database.length === 0) {

    employeeList.innerHTML =
      "<h3>No employees registered</h3>";

    return;
  }


  let html =
    "<h3>Registered Employees</h3>";


  database.forEach(
    (person, index) => {

      html += `

        <div class="employee">

          <b>${person.employeeId}</b>
          -
          ${person.employeeName}

          <button
            class="deleteBtn"
            onclick="deleteEmployee(${index})"
          >
            Delete
          </button>

        </div>

      `;

    }
  );


  employeeList.innerHTML =
    html;

}


// ==========================================
// DELETE EMPLOYEE
// ==========================================

function deleteEmployee(index) {

  const database =
    JSON.parse(
      localStorage.getItem(
        "faceDatabase"
      ) || "[]"
    );


  const person =
    database[index];


  const confirmDelete =
    confirm(
      "Delete this employee?\n\n" +
      person.employeeId +
      " - " +
      person.employeeName
    );


  if (!confirmDelete) return;


  database.splice(
    index,
    1
  );


  localStorage.setItem(
    "faceDatabase",
    JSON.stringify(database)
  );


  showEmployees();


  resultText.innerText =
    "Employee deleted";

}


// ==========================================
// CLEAR INPUT
// ==========================================

function clearFields() {

  employeeIdInput.value = "";
  employeeNameInput.value = "";

  resultText.innerText =
    "Enter Employee ID and Name";
  employeeNameDisplay.innerText = "";

}


// ==========================================
// START
// ==========================================

start();

</script>

</body>
</html>
