<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face AI Attendance</title>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/human/dist/human.js"></script>

  <style>
    body {
      text-align: center;
      font-family: Arial;
      margin: 20px;
    }

    video {
      width: 90%;
      max-width: 500px;
      border-radius: 12px;
      background: black;
      margin-top: 15px;
    }

    #status {
      font-size: 18px;
      font-weight: bold;
    }

    #faceStatus {
      font-size: 20px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<h2>Face AI Attendance</h2>

<p id="status">Starting...</p>

<video id="video" autoplay muted playsinline></video>

<p id="faceStatus">📷 Starting camera...</p>

<script>

const status = document.getElementById("status");
const faceStatus = document.getElementById("faceStatus");
const video = document.getElementById("video");

let human = null;
let detecting = false;


// ==========================
// CAMERA
// ==========================

async function startCamera() {

  try {

    status.innerText = "📷 Starting Camera...";

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: 640,
        height: 480
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    status.innerText = "✅ Camera Started";
    faceStatus.innerText = "👤 Camera ON";

    console.log("Camera started");

    startAI();

  } catch (error) {

    console.error(error);

    status.innerText = "❌ Camera Error";
    faceStatus.innerText = error.message;

  }

}


// ==========================
// HUMAN AI
// ==========================

function startAI() {

  try {

    status.innerText = "⚙️ Starting Face AI...";

    const config = {

      backend: "webgl",

      modelBasePath:
        "https://cdn.jsdelivr.net/npm/@vladmandic/human/models/",

      face: {

        enabled: true,

        detector: {
          enabled: true,
          rotation: true,
          maxDetected: 5
        },

        mesh: {
          enabled: false
        },

        iris: {
          enabled: false
        },

        description: {
          enabled: false
        }

      },

      body: {
        enabled: false
      },

      hand: {
        enabled: false
      },

      object: {
        enabled: false
      }

    };


    // IMPORTANT:
    // Human.Human()

    human = new Human.Human(config);

    status.innerText = "✅ Face AI Started";

    faceStatus.innerText =
      "👤 Looking for face...";

    console.log("Human AI initialized");

    detectFace();

  } catch (error) {

    console.error(error);

    status.innerText = "❌ AI Error";

    faceStatus.innerText =
      error.message;

  }

}


// ==========================
// FACE DETECTION
// ==========================

async function detectFace() {

  if (!human || detecting) return;

  detecting = true;

  try {

    const result = await human.detect(video);

    console.log(result);

    if (result.face && result.face.length > 0) {

      faceStatus.innerText =
        "✅ FACE DETECTED";

    } else {

      faceStatus.innerText =
        "👤 No Face Detected";

    }

  } catch (error) {

    console.error(error);

    faceStatus.innerText =
      "❌ Detection Error";

  }

  detecting = false;

  setTimeout(detectFace, 200);

}


// ==========================
// START
// ==========================

startCamera();

</script>

</body>
</html>
