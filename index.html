<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face AI Attendance</title>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/human/dist/human.js"></script>

  <style>
    body {
      text-align: center;
      font-family: Arial;
      margin: 20px;
    }

    video {
      width: 90%;
      max-width: 500px;
      border-radius: 12px;
      margin-top: 15px;
      background: black;
    }

    #status {
      font-size: 18px;
      font-weight: bold;
    }

    #faceStatus {
      font-size: 20px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<h2>Face AI Attendance</h2>

<p id="status">Starting Camera...</p>

<video id="video" autoplay muted playsinline></video>

<p id="faceStatus">📷 Camera starting...</p>

<script>

const status = document.getElementById("status");
const faceStatus = document.getElementById("faceStatus");
const video = document.getElementById("video");

let human;

// -------------------------
// CAMERA
// -------------------------

async function startCamera() {

  try {

    status.innerText = "📷 Requesting Camera...";

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: 640,
        height: 480
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    status.innerText = "✅ Camera Started";
    faceStatus.innerText = "👤 Camera is ON";

    console.log("Camera started");

    // Camera চালু হওয়ার পর AI load হবে
    loadAI();

  } catch (error) {

    console.error(error);

    status.innerText = "❌ Camera Error";

    faceStatus.innerText =
      "Camera permission দিতে হবে";

  }

}


// -------------------------
// AI
// -------------------------

async function loadAI() {

  try {

    status.innerText = "⏳ Loading Face AI...";

    const config = {

      backend: "webgl",

      modelBasePath:
        "https://cdn.jsdelivr.net/npm/@vladmandic/human/models/",

      face: {

        enabled: true,

        detector: {
          rotation: true,
          maxDetected: 5
        },

        mesh: {
          enabled: true
        },

        iris: {
          enabled: true
        },

        description: {
          enabled: true
        }

      }

    };

    human = new Human(config);

    await human.load();

    status.innerText = "✅ Face AI Ready";

    faceStatus.innerText =
      "👤 Looking for face...";

    detectFace();

  } catch (error) {

    console.error(error);

    status.innerText =
      "❌ Face AI Loading Error";

    faceStatus.innerText =
      error.message;

  }

}


// -------------------------
// FACE DETECTION
// -------------------------

async function detectFace() {

  if (!human) return;

  try {

    const result = await human.detect(video);

    if (result.face && result.face.length > 0) {

      faceStatus.innerText =
        "✅ FACE DETECTED";

    } else {

      faceStatus.innerText =
        "👤 No Face Detected";

    }

  } catch (error) {

    console.error(error);

  }

  requestAnimationFrame(detectFace);

}


// START

startCamera();

</script>

</body>
</html>
